<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">dsh-usage-stats token usage panel</title>
  <desc id="desc">A sanitized vector preview of the DeepSeek Harness usage panel: today, month and all-time token totals, a monthly calendar heatmap with a calendar/curve view toggle, a today-by-model ranking, and secret-free export links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="0.52" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#20355d" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .muted { fill: #718096; }
      .label { fill: #536179; font-size: 14px; font-weight: 600; }
      .tiny { fill: #7d899d; font-size: 12px; }
      .day { fill: #5d687b; font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
      .day-light { fill: #ffffff; }
      .row { font-size: 12px; }
    </style>
  </defs>

  <rect width="1400" height="860" rx="30" fill="url(#bg)"/>
  <circle cx="1275" cy="95" r="180" fill="#dfeaff" opacity="0.55"/>
  <circle cx="1170" cy="790" r="230" fill="#e6efff" opacity="0.66"/>
  <path d="M1010 0h390v860h-390c84-160 91-302 20-426C969 328 970 183 1010 0Z" fill="#f8faff" opacity="0.72"/>

  <!-- Harness rail -->
  <rect x="28" y="32" width="66" height="796" rx="24" fill="#ffffff" stroke="#e5eaf3"/>
  <g transform="translate(48 55)">
    <path d="M4 16c2-7 7-11 14-11 4 0 8 2 10 5-5 0-9 2-11 7 4-2 8-2 12 0-3 7-8 10-15 9-6-1-10-4-10-10Z" fill="#172033"/>
    <circle cx="23" cy="12" r="2" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#56647b" stroke-width="2" stroke-linecap="round">
    <circle cx="61" cy="142" r="11"/><path d="M61 136v12M55 142h12"/>
    <circle cx="61" cy="214" r="11"/><path d="M56 209l10 10M66 209l-10 10"/>
    <rect x="49" y="276" width="24" height="20" rx="5"/><path d="M55 282h12M55 289h8"/>
  </g>
  <rect x="41" y="675" width="40" height="40" rx="13" fill="#eaf2ff"/>
  <g transform="translate(50 684)" fill="none" stroke="#246ff2" stroke-width="2"><ellipse cx="11" cy="5" rx="9" ry="4"/><path d="M2 5v12c0 2 4 4 9 4s9-2 9-4V5M2 11c0 2 4 4 9 4s9-2 9-4"/><circle cx="19" cy="18" r="5" fill="#fff"/><path d="M19 15v6M16 18h6"/></g>
  <g transform="translate(49 758)" fill="none" stroke="#56647b" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4M4 4l3 3M17 17l3 3M20 4l-3 3M7 17l-3 3"/></g>

  <!-- Main panel -->
  <g filter="url(#shadow)">
    <rect x="126" y="42" width="720" height="776" rx="24" fill="url(#panel)" stroke="#dfe5ef"/>
  </g>
  <rect x="126" y="42" width="720" height="72" rx="24" fill="#ffffff"/>
  <path d="M126 90h720v24H126Z" fill="#ffffff"/>
  <line x1="126" y1="114" x2="846" y2="114" stroke="#e9edf4"/>
  <g transform="translate(154 66)" fill="none" stroke="#1e293b" stroke-width="2"><ellipse cx="10" cy="5" rx="8" ry="4"/><path d="M2 5v13c0 2 4 4 8 4s8-2 8-4V5M2 11c0 2 4 4 8 4s8-2 8-4"/><circle cx="19" cy="18" r="5" fill="#fff"/><path d="M19 15v6M16 18h6"/></g>
  <text x="190" y="84" font-size="19" font-weight="700">用量</text>
  <text x="754" y="84" font-size="22" class="muted">↻</text>
  <path d="M807 73l12 12M819 73l-12 12" stroke="#8490a3" stroke-width="2" stroke-linecap="round"/>

  <!-- Token totals: today / month / all time, abbreviated above 10,000 -->
  <text x="154" y="150" class="label">Token 用量</text>
  <g>
    <rect x="154" y="162" width="204" height="76" rx="15" fill="#ffffff" stroke="#e2e7f0"/>
    <text x="172" y="196" font-size="21" font-weight="750">1.2M</text><text x="172" y="220" class="tiny">今日</text>
    <rect x="370" y="162" width="204" height="76" rx="15" fill="#ffffff" stroke="#e2e7f0"/>
    <text x="388" y="196" font-size="21" font-weight="750">8.8M</text><text x="388" y="220" class="tiny">本月</text>
    <rect x="586" y="162" width="232" height="76" rx="15" fill="#ffffff" stroke="#e2e7f0"/>
    <text x="604" y="196" font-size="21" font-weight="750">42M</text><text x="604" y="220" class="tiny">累计</text>
  </g>
  <text x="154" y="262" class="tiny">今日缓存命中率 98.7%</text>

  <!-- Monthly view: title row, calendar/curve toggle, calendar heatmap -->
  <text x="154" y="296" class="label">当月每日用量</text>
  <text x="726" y="296" class="muted" font-size="20">‹</text>
  <text x="772" y="296" font-size="15" font-weight="700" text-anchor="middle">2026年8月</text>
  <text x="812" y="296" class="muted" font-size="20">›</text>

  <g>
    <rect x="154" y="306" width="82" height="24" rx="7" fill="#eef1f6"/>
    <rect x="155" y="307" width="40" height="22" rx="6" fill="#ffffff" stroke="#d7dfec"/>
    <text x="175" y="322" font-size="11" text-anchor="middle" font-weight="500">日历</text>
    <text x="215" y="322" font-size="11" text-anchor="middle" class="muted">曲线</text>
  </g>

  <g class="tiny" text-anchor="middle">
    <text x="228" y="348">一</text><text x="314" y="348">二</text><text x="400" y="348">三</text><text x="486" y="348">四</text><text x="572" y="348">五</text><text x="658" y="348">六</text><text x="744" y="348">日</text>
  </g>
  <g>
    <!-- row 1: Aug 1 2026 falls on Saturday -->
    <rect x="621" y="356" width="74" height="36" rx="9" fill="#edf0f5"/><text x="658" y="374" class="day">1</text>
    <rect x="707" y="356" width="74" height="36" rx="9" fill="#edf0f5"/><text x="744" y="374" class="day">2</text>
    <!-- row 2 -->
    <rect x="191" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="228" y="414" class="day">3</text>
    <rect x="277" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="314" y="414" class="day">4</text>
    <rect x="363" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="400" y="414" class="day">5</text>
    <rect x="449" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="486" y="414" class="day">6</text>
    <rect x="535" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="572" y="414" class="day">7</text>
    <rect x="621" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="658" y="414" class="day">8</text>
    <rect x="707" y="396" width="74" height="36" rx="9" fill="#edf0f5"/><text x="744" y="414" class="day">9</text>
    <!-- row 3 -->
    <rect x="191" y="436" width="74" height="36" rx="9" fill="#edf0f5"/><text x="228" y="454" class="day">10</text>
    <rect x="277" y="436" width="74" height="36" rx="9" fill="#edf0f5"/><text x="314" y="454" class="day">11</text>
    <rect x="363" y="436" width="74" height="36" rx="9" fill="#dce9ff"/><text x="400" y="454" class="day">12</text>
    <rect x="449" y="436" width="74" height="36" rx="9" fill="#2368f2"/><text x="486" y="454" class="day day-light">13</text>
    <rect x="535" y="436" width="74" height="36" rx="9" fill="#4d8cf5"/><text x="572" y="454" class="day day-light">14</text>
    <rect x="621" y="436" width="74" height="36" rx="9" fill="#a9c8fb" stroke="#2368f2"/><text x="658" y="454" class="day">15</text>
    <rect x="707" y="436" width="74" height="36" rx="9" fill="#edf0f5"/><text x="744" y="454" class="day">16</text>
    <!-- row 4 -->
    <rect x="191" y="476" width="74" height="36" rx="9" fill="#dce9ff"/><text x="228" y="494" class="day">17</text>
    <rect x="277" y="476" width="74" height="36" rx="9" fill="#4d8cf5"/><text x="314" y="494" class="day day-light">18</text>
    <rect x="363" y="476" width="74" height="36" rx="9" fill="#edf0f5"/><text x="400" y="494" class="day">19</text>
    <rect x="449" y="476" width="74" height="36" rx="9" fill="#a9c8fb"/><text x="486" y="494" class="day">20</text>
    <rect x="535" y="476" width="74" height="36" rx="9" fill="#edf0f5"/><text x="572" y="494" class="day">21</text>
    <rect x="621" y="476" width="74" height="36" rx="9" fill="#edf0f5"/><text x="658" y="494" class="day">22</text>
    <rect x="707" y="476" width="74" height="36" rx="9" fill="#dce9ff"/><text x="744" y="494" class="day">23</text>
    <!-- row 5 -->
    <rect x="191" y="516" width="74" height="36" rx="9" fill="#edf0f5"/><text x="228" y="534" class="day">24</text>
    <rect x="277" y="516" width="74" height="36" rx="9" fill="#a9c8fb"/><text x="314" y="534" class="day">25</text>
    <rect x="363" y="516" width="74" height="36" rx="9" fill="#2368f2"/><text x="400" y="534" class="day day-light">26</text>
    <rect x="449" y="516" width="74" height="36" rx="9" fill="#edf0f5"/><text x="486" y="534" class="day">27</text>
    <rect x="535" y="516" width="74" height="36" rx="9" fill="#4d8cf5"/><text x="572" y="534" class="day day-light">28</text>
    <rect x="621" y="516" width="74" height="36" rx="9" fill="#edf0f5"/><text x="658" y="534" class="day">29</text>
    <rect x="707" y="516" width="74" height="36" rx="9" fill="#edf0f5"/><text x="744" y="534" class="day">30</text>
    <!-- row 6 -->
    <rect x="191" y="556" width="74" height="36" rx="9" fill="#edf0f5"/><text x="228" y="574" class="day">31</text>
  </g>
  <g transform="translate(154 604)">
    <text x="0" y="12" class="tiny">少</text>
    <rect x="28" y="2" width="13" height="13" rx="3" fill="#edf0f5"/><rect x="47" y="2" width="13" height="13" rx="3" fill="#dce9ff"/><rect x="66" y="2" width="13" height="13" rx="3" fill="#a9c8fb"/><rect x="85" y="2" width="13" height="13" rx="3" fill="#4d8cf5"/><rect x="104" y="2" width="13" height="13" rx="3" fill="#2368f2"/>
    <text x="126" y="12" class="tiny">多</text>
  </g>

  <!-- Today by model: replacing the removed recent-session cost block -->
  <text x="154" y="646" class="label">今日模型消耗</text>
  <g class="row">
    <text x="154" y="677" fill="#536179">deepseek-official · deepseek-chat</text>
    <rect x="370" y="668" width="208" height="6" rx="3" fill="#2368f2" opacity="0.65"/>
    <text x="818" y="677" text-anchor="end" fill="#172033" font-variant-numeric="tabular-nums">620K</text>
    <line x1="154" y1="690" x2="818" y2="690" stroke="#eef1f6"/>

    <text x="154" y="707" fill="#536179">ark · deepseek-chat</text>
    <rect x="370" y="698" width="136" height="6" rx="3" fill="#2368f2" opacity="0.65"/>
    <text x="818" y="707" text-anchor="end" fill="#172033" font-variant-numeric="tabular-nums">410K</text>
    <line x1="154" y1="720" x2="818" y2="720" stroke="#eef1f6"/>

    <text x="154" y="737" fill="#536179">openrouter · claude-sonnet-4</text>
    <rect x="370" y="728" width="32" height="6" rx="3" fill="#2368f2" opacity="0.65"/>
    <text x="818" y="737" text-anchor="end" fill="#172033" font-variant-numeric="tabular-nums">96K</text>
  </g>

  <!-- Secret-free export -->
  <text x="154" y="774" class="label">安全导出</text>
  <g>
    <rect x="154" y="784" width="88" height="28" rx="9" fill="#f4f7fc" stroke="#e2e7f0"/>
    <text x="198" y="802" font-size="12" text-anchor="middle" fill="#2b4d88">每日 CSV</text>
    <rect x="252" y="784" width="88" height="28" rx="9" fill="#f4f7fc" stroke="#e2e7f0"/>
    <text x="296" y="802" font-size="12" text-anchor="middle" fill="#2b4d88">会话 CSV</text>
    <rect x="350" y="784" width="88" height="28" rx="9" fill="#f4f7fc" stroke="#e2e7f0"/>
    <text x="394" y="802" font-size="12" text-anchor="middle" fill="#2b4d88">完整 JSON</text>
  </g>

  <!-- Release callouts -->
  <g transform="translate(922 126)">
    <rect x="0" y="0" width="112" height="30" rx="15" fill="#e7efff"/>
    <text x="56" y="20" text-anchor="middle" fill="#2468db" font-size="12" font-weight="750">v0.4.0</text>
    <text x="0" y="78" font-size="38" font-weight="800">一个面板，</text>
    <text x="0" y="124" font-size="38" font-weight="800">看清 Token 用量</text>
    <text x="0" y="166" font-size="16" class="muted">今日、本月、累计与模型排行统一呈现。</text>
    <text x="0" y="192" font-size="16" class="muted">供应商账户查询已移除，后台只做本地聚合。</text>

    <g transform="translate(0 244)">
      <rect width="390" height="86" rx="18" fill="#ffffff" stroke="#dfe6f2"/>
      <rect x="18" y="18" width="50" height="50" rx="15" fill="#eaf2ff"/>
      <g fill="#246ff2"><rect x="28" y="46" width="8" height="12" rx="2"/><rect x="39" y="38" width="8" height="20" rx="2"/><rect x="50" y="30" width="8" height="28" rx="2"/></g>
      <text x="86" y="39" font-size="15" font-weight="750">今日模型消耗</text>
      <text x="86" y="61" font-size="13" class="muted">按 provider · model 排行与占比条</text>
    </g>
    <g transform="translate(0 344)">
      <rect width="390" height="86" rx="18" fill="#ffffff" stroke="#dfe6f2"/>
      <rect x="18" y="18" width="50" height="50" rx="15" fill="#ecf9f2"/>
      <path d="M30 54c6-14 10-22 15-22s7 12 11 12 6-8 9-14" fill="none" stroke="#20a566" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="86" y="39" font-size="15" font-weight="750">日历 / 曲线视图</text>
      <text x="86" y="61" font-size="13" class="muted">平滑折线 + 渐变面积，按平方根缩放</text>
    </g>
    <g transform="translate(0 444)">
      <rect width="390" height="86" rx="18" fill="#ffffff" stroke="#dfe6f2"/>
      <rect x="18" y="18" width="50" height="50" rx="15" fill="#fff4e7"/>
      <text x="43" y="50" text-anchor="middle" fill="#e58a25" font-size="14" font-weight="750">33.8M</text>
      <text x="86" y="39" font-size="15" font-weight="750">紧凑数字</text>
      <text x="86" y="61" font-size="13" class="muted">K/M/B/T 缩写，悬停显示精确值</text>
    </g>
    <g transform="translate(0 568)">
      <circle cx="9" cy="9" r="9" fill="#246ff2"/><path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-size="14" font-weight="650">DeepSeek Harness Web GUI</text>
      <text x="0" y="48" font-size="12" class="muted">示例数据 · Sanitized demo data</text>
    </g>
  </g>
</svg>
