<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
  <title id="title">dsh-usage-stats token usage panel</title>
  <desc id="desc">A sanitized vector preview of the DeepSeek Harness usage panel: today, month and all-time token totals, a three-way range switch (today / last 7 days / last 30 days) where "today" sizes the donut only and the multi-model daily trend keeps its 7-day floor and ends today, a model-usage donut with two-way hover linking, a curve/calendar view switch (the calendar is a compact centred month view), and secret-free export links.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="0.52" stop-color="#f4f7fc"/>
      <stop offset="1" stop-color="#eef3ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#20355d" flood-opacity="0.14"/>
    </filter>
    <filter id="card" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#2b4d88" flood-opacity="0.16"/>
    </filter>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; fill: #172033; }
      .muted { fill: #718096; }
      .label { fill: #536179; font-size: 14px; font-weight: 600; }
      .tiny { fill: #7d899d; font-size: 12px; }
      .tick { fill: #8a95a6; font-size: 9px; }
      .legend { fill: #536179; font-size: 11px; }
      .seg { font-size: 11px; }
      .row { font-size: 12px; }
    </style>
  </defs>

  <rect width="1400" height="860" rx="30" fill="url(#bg)"/>
  <circle cx="1275" cy="95" r="180" fill="#dfeaff" opacity="0.55"/>
  <circle cx="1170" cy="790" r="230" fill="#e6efff" opacity="0.66"/>
  <path d="M1010 0h390v860h-390c84-160 91-302 20-426C969 328 970 183 1010 0Z" fill="#f8faff" opacity="0.72"/>

  <!-- Harness rail -->
  <rect x="28" y="32" width="66" height="796" rx="24" fill="#ffffff" stroke="#e5eaf3"/>
  <g transform="translate(48 55)">
    <path d="M4 16c2-7 7-11 14-11 4 0 8 2 10 5-5 0-9 2-11 7 4-2 8-2 12 0-3 7-8 10-15 9-6-1-10-4-10-10Z" fill="#172033"/>
    <circle cx="23" cy="12" r="2" fill="#ffffff"/>
  </g>
  <g fill="none" stroke="#56647b" stroke-width="2" stroke-linecap="round">
    <circle cx="61" cy="142" r="11"/><path d="M61 136v12M55 142h12"/>
    <circle cx="61" cy="214" r="11"/><path d="M56 209l10 10M66 209l-10 10"/>
    <rect x="49" y="276" width="24" height="20" rx="5"/><path d="M55 282h12M55 289h8"/>
  </g>
  <rect x="41" y="675" width="40" height="40" rx="13" fill="#eaf2ff"/>
  <g transform="translate(50 684)" fill="none" stroke="#246ff2" stroke-width="2"><ellipse cx="11" cy="5" rx="9" ry="4"/><path d="M2 5v12c0 2 4 4 9 4s9-2 9-4V5M2 11c0 2 4 4 9 4s9-2 9-4"/><circle cx="19" cy="18" r="5" fill="#fff"/><path d="M19 15v6M16 18h6"/></g>
  <g transform="translate(49 758)" fill="none" stroke="#56647b" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4M4 4l3 3M17 17l3 3M20 4l-3 3M7 17l-3 3"/></g>

  <!-- Main panel -->
  <g filter="url(#shadow)">
    <rect x="126" y="42" width="720" height="776" rx="24" fill="url(#panel)" stroke="#dfe5ef"/>
  </g>
  <rect x="126" y="42" width="720" height="72" rx="24" fill="#ffffff"/>
  <path d="M126 90h720v24H126Z" fill="#ffffff"/>
  <line x1="126" y1="114" x2="846" y2="114" stroke="#e9edf4"/>
  <g transform="translate(154 66)" fill="none" stroke="#1e293b" stroke-width="2"><ellipse cx="10" cy="5" rx="8" ry="4"/><path d="M2 5v13c0 2 4 4 8 4s8-2 8-4V5M2 11c0 2 4 4 8 4s8-2 8-4"/><circle cx="19" cy="18" r="5" fill="#fff"/><path d="M19 15v6M16 18h6"/></g>
  <text x="190" y="84" font-size="19" font-weight="700">用量</text>
  <text x="754" y="84" font-size="22" class="muted">↻</text>
  <path d="M807 73l12 12M819 73l-12 12" stroke="#8490a3" stroke-width="2" stroke-linecap="round"/>

  <!-- Token totals: today / month / all time, abbreviated above 10,000 -->
  <text x="154" y="150" class="label">Token 用量</text>
  <g>
    <rect x="154" y="162" width="204" height="76" rx="15" fill="#ffffff" stroke="#e2e7f0"/>
    <text x="172" y="196" font-size="21" font-weight="750">1.2M</text><text x="172" y="220" class="tiny">今日</text>
    <rect x="370" y="162" width="204" height="76" rx="15" fill="#ffffff" stroke="#e2e7f0"/>
    <text x="388" y="196" font-size="21" font-weight="750">8.8M</text><text x="388" y="220" class="tiny">本月</text>
    <rect x="586" y="162" width="232" height="76" rx="15" fill="#ffffff" stroke="#e2e7f0"/>
    <text x="604" y="196" font-size="21" font-weight="750">42M</text><text x="604" y="220" class="tiny">累计</text>
  </g>
  <text x="154" y="262" class="tiny">今日缓存命中率 98.7%</text>

  <!-- Analysis header: title, three-way range switch, then the view switch (no month arrows in curve view) -->
  <text x="154" y="305" class="label">每日 Token 趋势图</text>
  <g>
    <rect x="546" y="288" width="168" height="24" rx="7" fill="#eef1f6"/>
    <text x="569" y="304" class="seg muted" text-anchor="middle">每天</text>
    <rect x="592" y="289" width="58" height="22" rx="6" fill="#ffffff" stroke="#d7dfec"/>
    <text x="621" y="304" class="seg" text-anchor="middle" font-weight="500">近 7 天</text>
    <text x="682" y="304" class="seg muted" text-anchor="middle">近 30 天</text>
  </g>
  <g>
    <rect x="722" y="288" width="96" height="24" rx="7" fill="#eef1f6"/>
    <rect x="723" y="289" width="46" height="22" rx="6" fill="#ffffff" stroke="#d7dfec"/>
    <text x="746" y="304" class="seg" text-anchor="middle" font-weight="500">曲线</text>
    <text x="793" y="304" class="seg muted" text-anchor="middle">日历</text>
  </g>

  <!-- Trend legend: one colour dot per series, long tail aggregated -->
  <g>
    <circle cx="158" cy="332" r="4" fill="#1f6feb"/>
    <text x="170" y="336" class="legend">deepseek-official · deepseek-chat</text>
    <circle cx="392" cy="332" r="4" fill="#12a150"/>
    <text x="404" y="336" class="legend">ark · deepseek-chat</text>
    <circle cx="158" cy="350" r="4" fill="#8b5cf6"/>
    <text x="170" y="354" class="legend">openrouter · claude-sonnet-4</text>
    <circle cx="392" cy="350" r="4" fill="#e8590c"/>
    <text x="404" y="354" class="legend">zai · glm-4.6</text>
    <circle cx="512" cy="350" r="4" fill="#9aa0a6"/>
    <text x="524" y="354" class="legend">其他模型（1）</text>
  </g>

  <!-- Rolling 7-day plot: four dashed gridlines, one smooth line per series, solid baseline, axis ends today -->
  <g stroke="#e4e9f2" stroke-width="1" stroke-dasharray="4 4">
    <line x1="154" y1="372" x2="818" y2="372"/>
    <line x1="154" y1="410" x2="818" y2="410"/>
    <line x1="154" y1="448" x2="818" y2="448"/>
    <line x1="154" y1="486" x2="818" y2="486"/>
  </g>
  <line x1="154" y1="524" x2="818" y2="524" stroke="#cfd7e5" stroke-width="1"/>
  <g fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#1f6feb" d="M 154 467 C 190.9 460.7 190.9 441.7 264.7 448 C 338.5 454.3 301.5 498.7 375.3 486 C 449.1 473.3 412.2 429.0 486 410 C 559.8 391.0 522.9 414.2 596.7 429 C 670.5 443.8 633.5 473.3 707.3 454.3 C 781.1 435.3 781.1 399.4 818 372"/>
    <path stroke="#12a150" d="M 154 479.7 C 190.9 475.5 190.9 462.8 264.7 467 C 338.5 471.2 301.5 496.5 375.3 492.3 C 449.1 488.1 412.2 462.7 486 454.3 C 559.8 445.9 522.9 458.5 596.7 467 C 670.5 475.5 633.5 490.3 707.3 479.7 C 781.1 469.1 781.1 450.1 818 435.3"/>
    <path stroke="#8b5cf6" d="M 154 498.7 C 190.9 494.5 190.9 483.9 264.7 486 C 338.5 488.1 301.5 507.1 375.3 505 C 449.1 502.9 412.2 486.0 486 479.7 C 559.8 473.4 522.9 481.8 596.7 486 C 670.5 490.2 633.5 500.7 707.3 492.3 C 781.1 483.9 781.1 471.2 818 460.7"/>
    <path stroke="#e8590c" d="M 154 505 C 190.9 505.0 190.9 505.0 264.7 505 C 338.5 505.0 301.5 507.1 375.3 505 C 449.1 502.9 412.2 500.8 486 498.7 C 559.8 496.6 522.9 498.7 596.7 498.7 C 670.5 498.7 633.5 509.3 707.3 498.7 C 781.1 488.1 781.1 477.6 818 467"/>
    <path stroke="#9aa0a6" d="M 154 517.7 C 190.9 517.7 190.9 517.7 264.7 517.7 C 338.5 517.7 301.5 519.8 375.3 517.7 C 449.1 515.6 412.2 513.4 486 511.3 C 559.8 509.2 522.9 511.3 596.7 511.3 C 670.5 511.3 633.5 513.4 707.3 511.3 C 781.1 509.2 781.1 507.1 818 505"/>
  </g>

  <!-- Trend hover card: date, day total and the per-model split -->
  <g filter="url(#card)">
    <rect x="214" y="376" width="244" height="124" rx="8" fill="#ffffff" stroke="#e2e7f0"/>
  </g>
  <text x="226" y="396" font-size="11" fill="#718096">10-15 周三 · 180K tokens</text>
  <g>
    <circle cx="230" cy="412" r="3.5" fill="#1f6feb"/>
    <text x="242" y="416" font-size="11" fill="#536179">deepseek-official · deepseek-chat</text>
    <text x="446" y="416" font-size="11" font-weight="600" text-anchor="end">60K</text>
    <circle cx="230" cy="430" r="3.5" fill="#12a150"/>
    <text x="242" y="434" font-size="11" fill="#536179">ark · deepseek-chat</text>
    <text x="446" y="434" font-size="11" font-weight="600" text-anchor="end">50K</text>
    <circle cx="230" cy="448" r="3.5" fill="#8b5cf6"/>
    <text x="242" y="452" font-size="11" fill="#536179">openrouter · claude-sonnet-4</text>
    <text x="446" y="452" font-size="11" font-weight="600" text-anchor="end">30K</text>
    <circle cx="230" cy="466" r="3.5" fill="#e8590c"/>
    <text x="242" y="470" font-size="11" fill="#536179">zai · glm-4.6</text>
    <text x="446" y="470" font-size="11" font-weight="600" text-anchor="end">30K</text>
    <circle cx="230" cy="484" r="3.5" fill="#9aa0a6"/>
    <text x="242" y="488" font-size="11" fill="#536179">其他模型（1）</text>
    <text x="446" y="488" font-size="11" font-weight="600" text-anchor="end">10K</text>
  </g>

  <!-- Date ticks: M/D form, the rightmost tick is today -->
  <g class="tick">
    <text x="154" y="546">10/13</text>
    <text x="375" y="546" text-anchor="middle">10/15</text>
    <text x="597" y="546" text-anchor="middle">10/17</text>
    <text x="818" y="546" text-anchor="end">10/19</text>
  </g>

  <!-- Model usage donut over the same window; the "ark" slice is hovered -->
  <text x="154" y="570" class="label">近 7 天模型用量</text>
  <g>
    <circle cx="218" cy="646" r="52" fill="none" stroke="#1f6feb" stroke-width="16" stroke-dasharray="129.33 326.73" stroke-dashoffset="0" transform="rotate(-90 218 646)"/>
    <circle cx="218" cy="646" r="52" fill="none" stroke="#12a150" stroke-width="21" stroke-dasharray="84.4 326.73" stroke-dashoffset="-129.33" transform="rotate(-90 218 646)"/>
    <circle cx="218" cy="646" r="52" fill="none" stroke="#8b5cf6" stroke-width="16" stroke-dasharray="55.82 326.73" stroke-dashoffset="-213.73" transform="rotate(-90 218 646)"/>
    <circle cx="218" cy="646" r="52" fill="none" stroke="#e8590c" stroke-width="16" stroke-dasharray="40.84 326.73" stroke-dashoffset="-269.55" transform="rotate(-90 218 646)"/>
    <circle cx="218" cy="646" r="52" fill="none" stroke="#9aa0a6" stroke-width="16" stroke-dasharray="16.34 326.73" stroke-dashoffset="-310.39" transform="rotate(-90 218 646)"/>
  </g>
  <!-- Hover card replaces the ring centre while a slice is hovered -->
  <g filter="url(#card)">
    <rect x="156" y="626" width="124" height="40" rx="8" fill="#ffffff" stroke="#e2e7f0"/>
  </g>
  <circle cx="166" cy="637" r="3" fill="#12a150"/>
  <text x="176" y="641" font-size="9.5" fill="#536179">ark · deepseek-chat</text>
  <text x="222" y="658" font-size="10.5" font-weight="600" text-anchor="end">620K</text>
  <text x="230" y="658" font-size="9.5" fill="#7d899d">26%</text>

  <g class="row">
    <circle cx="306" cy="592" r="4" fill="#1f6feb"/>
    <text x="318" y="596" fill="#536179">deepseek-official · deepseek-chat</text>
    <text x="740" y="596" font-size="11" text-anchor="end" fill="#8a95a6">40%</text>
    <text x="818" y="596" text-anchor="end">950K</text>
    <line x1="300" y1="608" x2="818" y2="608" stroke="#eef1f6"/>

    <rect x="300" y="612" width="518" height="28" rx="5" fill="#f2f5fa"/>
    <circle cx="306" cy="622" r="4" fill="#12a150"/>
    <text x="318" y="626" fill="#536179">ark · deepseek-chat</text>
    <text x="740" y="626" font-size="11" text-anchor="end" fill="#8a95a6">26%</text>
    <text x="818" y="626" text-anchor="end">620K</text>
    <line x1="300" y1="638" x2="818" y2="638" stroke="#eef1f6"/>

    <circle cx="306" cy="652" r="4" fill="#8b5cf6"/>
    <text x="318" y="656" fill="#536179">openrouter · claude-sonnet-4</text>
    <text x="740" y="656" font-size="11" text-anchor="end" fill="#8a95a6">17%</text>
    <text x="818" y="656" text-anchor="end">410K</text>
    <line x1="300" y1="668" x2="818" y2="668" stroke="#eef1f6"/>

    <circle cx="306" cy="682" r="4" fill="#e8590c"/>
    <text x="318" y="686" fill="#536179">zai · glm-4.6</text>
    <text x="740" y="686" font-size="11" text-anchor="end" fill="#8a95a6">13%</text>
    <text x="818" y="686" text-anchor="end">300K</text>
    <line x1="300" y1="698" x2="818" y2="698" stroke="#eef1f6"/>

    <circle cx="306" cy="712" r="4" fill="#9aa0a6"/>
    <text x="318" y="716" fill="#536179">其他模型（1）</text>
    <text x="740" y="716" font-size="11" text-anchor="end" fill="#8a95a6">5%</text>
    <text x="818" y="716" text-anchor="end">120K</text>
  </g>

  <!-- Secret-free export -->
  <text x="154" y="756" class="label">安全导出</text>
  <g>
    <rect x="154" y="766" width="88" height="28" rx="9" fill="#f4f7fc" stroke="#e2e7f0"/>
    <text x="198" y="784" font-size="12" text-anchor="middle" fill="#2b4d88">每日 CSV</text>
    <rect x="252" y="766" width="88" height="28" rx="9" fill="#f4f7fc" stroke="#e2e7f0"/>
    <text x="296" y="784" font-size="12" text-anchor="middle" fill="#2b4d88">会话 CSV</text>
    <rect x="350" y="766" width="88" height="28" rx="9" fill="#f4f7fc" stroke="#e2e7f0"/>
    <text x="394" y="784" font-size="12" text-anchor="middle" fill="#2b4d88">完整 JSON</text>
  </g>

  <!-- Release callouts -->
  <g transform="translate(922 126)">
    <rect x="0" y="0" width="112" height="30" rx="15" fill="#e7efff"/>
    <text x="56" y="20" text-anchor="middle" fill="#2468db" font-size="12" font-weight="750">v0.4.0</text>
    <text x="0" y="78" font-size="38" font-weight="800">一个面板，</text>
    <text x="0" y="124" font-size="38" font-weight="800">看清 Token 用量</text>
    <text x="0" y="166" font-size="16" class="muted">每天 / 近 7 天 / 近 30 天的滚动窗口，止于今天。</text>
    <text x="0" y="192" font-size="16" class="muted">「每天」只改环形图，曲线仍保持近 7 天。</text>
    <text x="0" y="218" font-size="16" class="muted">日历是居中缩小的紧凑月历，曲线占地不变。</text>

    <g transform="translate(0 244)">
      <rect width="390" height="86" rx="18" fill="#ffffff" stroke="#dfe6f2"/>
      <rect x="18" y="18" width="50" height="50" rx="15" fill="#eaf2ff"/>
      <g fill="none" stroke="#246ff2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M28 54c5-10 8-18 13-18s8 12 13 10 9-16 14-16"/>
        <path d="M28 60c6 0 9-6 14-6s9 8 16 4 9-10 14-12" stroke="#8fb6f8"/>
      </g>
      <text x="86" y="39" font-size="15" font-weight="750">每日趋势图</text>
      <text x="86" y="61" font-size="13" class="muted">多模型分色折线，横轴止于今天</text>
    </g>
    <g transform="translate(0 344)">
      <rect width="390" height="86" rx="18" fill="#ffffff" stroke="#dfe6f2"/>
      <rect x="18" y="18" width="50" height="50" rx="15" fill="#ecf9f2"/>
      <g transform="rotate(-90 43 43)">
        <circle cx="43" cy="43" r="14" fill="none" stroke="#20a566" stroke-width="8" stroke-dasharray="52 88"/>
        <circle cx="43" cy="43" r="14" fill="none" stroke="#7cc9a2" stroke-width="8" stroke-dasharray="34 88" stroke-dashoffset="-52"/>
      </g>
      <text x="86" y="39" font-size="15" font-weight="750">模型用量环形图</text>
      <text x="86" y="61" font-size="13" class="muted">色块与列表行双向悬停联动</text>
    </g>
    <g transform="translate(0 444)">
      <rect width="390" height="86" rx="18" fill="#ffffff" stroke="#dfe6f2"/>
      <rect x="18" y="18" width="50" height="50" rx="15" fill="#fff4e7"/>
      <text x="43" y="50" text-anchor="middle" fill="#e58a25" font-size="14" font-weight="750">33.8M</text>
      <text x="86" y="39" font-size="15" font-weight="750">紧凑数字</text>
      <text x="86" y="61" font-size="13" class="muted">K/M/B/T 缩写，悬停显示精确值</text>
    </g>
    <g transform="translate(0 568)">
      <circle cx="9" cy="9" r="9" fill="#246ff2"/><path d="M5 9l3 3 6-7" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="14" font-size="14" font-weight="650">DeepSeek Harness Web GUI</text>
      <text x="0" y="48" font-size="12" class="muted">示例数据 · Sanitized demo data</text>
    </g>
  </g>
</svg>
